dependencies:
  idf: ">=5.4"
  # LVGL は使わない（描画は Rust 側）ので noglib 版の BSP
  espressif/m5stack_tab5_noglib: "~1.3"
  # BSP の touch.h が include するが、BSP では非公開の依存なので main からも明示する
  espressif/esp_lcd_touch: "^1.2"
  # 機種判定（BSP の bsp_get_board_version と同じ）に使うタッチのアドレス定義
  espressif/esp_lcd_touch_gt911: "*"
  espressif/esp_lcd_touch_st7123: "*"
  # Tab5 の ESP32-C6（Wi-Fi）は SDIO 越しの esp_hosted。工場出荷の C6 ファームに合わせて
  # M5Stack 公式デモ（M5Tab5-UserDemo）と同じ esp_hosted 1.4.0 / esp_wifi_remote 0.8.5 を
  # components/ に同梱している（理由は components/esp_hosted/VENDORED.md）
