name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - run: deno task build
      - run: deno task check
      # ファームウェアのホスト: 実機向け（riscv32）がビルドできること、
      # 同じホストコードで実際のアプリが動くこと（Linux 上、画面は PNG）
      - name: firmware host
        working-directory: firmware
        run: |
          cargo build --release -p wasmos-esp --target riscv32imafc-unknown-none-elf
          cargo build --release -p wasmos-sim
      - name: firmware smoke test
        run: |
          ./firmware/target/release/wasmos-sim web/build/apps firmware/sim/smoke.txt | tee /tmp/sim.log
          ! grep -E "trap|failed|panic" /tmp/sim.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-screens
          path: /tmp/wasmos-*.png
